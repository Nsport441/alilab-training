# Test-only AliLab pipeline. No registry, Pages, mirror or release publication.
image: node:22-alpine
stages: [test]
frontend:
  stage: test
  script:
    - cd frontend
    - npm ci --ignore-scripts
    - npm test
    - npm run build
    - node scripts/check-locales.mjs
    - npm audit --omit=dev --audit-level=high
    - cd ..
    - node scripts/check-alilab-boundary.mjs
api:
  stage: test
  script:
    - cd api
    - npm ci --omit=optional --ignore-scripts
    - npm test
    - npm audit --omit=dev --omit=optional --audit-level=high
    - cd ..
    - node --test scripts/test/alilab-ops.test.mjs
    - node scripts/build-coach-assets.mjs --check
    - node api/scripts/check-core-loadable.mjs
