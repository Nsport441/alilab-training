name: alilab-training

services:
  api:
    build:
      context: ./api
      target: default
      args:
        VERSION: 1.3.9-alilab.1a
        VCS_REF: ${APP_BUILD:-phase1a-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${PORT:-3000}
      DATA_DIR: /data
      TRUST_PROXY: "1"
      COACH_DISABLED: "1"
      MEDIA_UPLOADS: "0"
    volumes:
      - alilab_data:/data
    # No published API port: only the trusted web proxy can reach it.

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        APP_BUILD: ${APP_BUILD:-phase1a-dev}
        VERSION: 1.3.9-alilab.1a
        VCS_REF: ${APP_BUILD:-phase1a-dev}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:${NGINX_PORT:-80}"
    environment:
      NGINX_PORT: ${NGINX_PORT:-80}
      BACKEND: api
      PORT: ${PORT:-3000}
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ""
      BASE_PATH: ""
      MEDIA_UPLOAD_MAX: 48m

volumes:
  alilab_data:
