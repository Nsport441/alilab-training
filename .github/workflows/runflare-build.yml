name: Runflare build artifacts (no deploy)
on:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["AliLab Phase 1A checks"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read

concurrency:
  group: runflare-pair-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Confirm successful main CI for manual release candidates
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, sys, urllib.request
          repo, sha, token = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_SHA'], os.environ['GH_TOKEN']
          headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as resp:
                  return json.load(resp)
          main = get('https://api.github.com/repos/' + repo + '/branches/main')
          if main['commit']['sha'] != sha: sys.exit('Manual candidate must use current main SHA')
          data = get('https://api.github.com/repos/' + repo + '/actions/workflows/test.yml/runs?head_sha=' + sha + '&event=push&per_page=100')
          if not any(r['head_sha'] == sha and r['head_branch'] == 'main' and r['event'] == 'push' and r['conclusion'] == 'success' for r in data.get('workflow_runs', [])):
              sys.exit('No successful full main CI for selected source SHA')
          print('Main CI confirmed for', sha)
          PY
      - name: Package committed service contexts
        run: node scripts/package-runflare.mjs HEAD
      - name: Build and smoke-test the exact upload contexts
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          for SERVICE in api web; do
            mkdir -p "/tmp/runflare-$SERVICE"
            unzip -q "artifacts/runflare/$SERVICE-$SHA.zip" -d "/tmp/runflare-$SERVICE"
            docker build --build-arg BUILD_DATE="$(git show -s --format=%cI HEAD)" \
              -t "alilab-training-$SERVICE:$SHA" "/tmp/runflare-$SERVICE"
            test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "alilab-training-$SERVICE:$SHA")" = "$SHA"
          done
          docker network create runflare-test
          docker run -d --name api --network runflare-test \
            -e PASSWORD_ONLY=1 -e COACH_DISABLED=1 -e MEDIA_UPLOADS=0 \
            -e DATA_DIR=/tmp/runflare-data -e ORIGIN=http://localhost:8080 \
            "alilab-training-api:$SHA"
          docker run -d --name web --network runflare-test -p 8080:80 "alilab-training-web:$SHA"
          curl --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ >/dev/null
          # Exercise media must be served as binaries, including newly supported five-digit IDs.
          MEDIA_ID=$(node --input-type=module -e "import {EXDB} from './frontend/src/lib/exercises-data.js'; console.log(EXDB.find(e=>e.id.length===5).id)")
          curl -fsS -D /tmp/clip-headers "http://localhost:8080/opengym-media/clip/$MEDIA_ID.mp4" -o /tmp/clip.mp4
          curl -fsS -D /tmp/still-headers "http://localhost:8080/opengym-media/still/$MEDIA_ID.webp" -o /tmp/still.webp
          grep -qi '^Content-Type: video/mp4' /tmp/clip-headers
          grep -qi '^Content-Type: image/webp' /tmp/still-headers
          cmp /tmp/clip.mp4 "frontend/public/opengym-media/clip/$MEDIA_ID.mp4"
          cmp /tmp/still.webp "frontend/public/opengym-media/still/$MEDIA_ID.webp"
          curl -fsS -D /tmp/web-release-headers http://localhost:8080/release-build.json -o /tmp/web-release.json
          node -e 'const fs=require("node:fs");const d=JSON.parse(fs.readFileSync("/tmp/web-release.json"));if (d.commit!==process.argv[1]) process.exit(1)' "$SHA"
          grep -qi '^Cache-Control: no-store' /tmp/web-release-headers
          curl -fsS http://localhost:8080/corresponding-source.tar.gz -o /tmp/source.tar.gz
          tar -xOf /tmp/source.tar.gz ./deployment-source.json | grep "$SHA"
          docker image inspect "alilab-training-api:$SHA" "alilab-training-web:$SHA" \
            --format '{{json .}}' > artifacts/runflare/images.jsonl
          docker save "alilab-training-api:$SHA" "alilab-training-web:$SHA" | gzip > artifacts/runflare/images.tar.gz
          (cd artifacts/runflare && sha256sum *.zip images.tar.gz images.jsonl sources.json > SHA256SUMS)
      - name: Record paired candidate provenance and verify identities
        shell: bash
        env:
          SOURCE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          export RELEASE_SHA="$(git rev-parse HEAD)"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const sha = process.env.RELEASE_SHA;
          const sources = JSON.parse(fs.readFileSync('artifacts/runflare/sources.json'));
          if (sources.commit !== sha) throw Error('Source manifest SHA mismatch');
          const images = fs.readFileSync('artifacts/runflare/images.jsonl', 'utf8').trim().split('\n').map(JSON.parse);
          if (images.length !== 2) throw Error('Expected two tested images');
          for (const service of ['api','web']) {
            if (!fs.existsSync('artifacts/runflare/' + service + '-' + sha + '.zip')) throw Error('Missing ' + service + ' ZIP');
            const matches = images.filter(i => i.Config?.Labels?.['org.opencontainers.image.title'] === 'alilab-training-' + service);
            if (matches.length !== 1 || matches[0].Config?.Labels?.['org.opencontainers.image.revision'] !== sha) throw Error('Image source mismatch: ' + service);
          }
          const candidate = {commit:sha,services:['api','web'],ciPassed:process.env.SOURCE_EVENT!=='pull_request',
            trigger:process.env.SOURCE_EVENT,runUrl:[process.env.GITHUB_SERVER_URL,process.env.GITHUB_REPOSITORY,'actions','runs',process.env.GITHUB_RUN_ID].join('/'),
            runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),runflareDeployment:'not_started',operatorApproval:'not_recorded'};
          fs.writeFileSync('artifacts/runflare/candidate.json',JSON.stringify(candidate,null,2)+'\n');
          JS
          (cd artifacts/runflare && sha256sum *.zip images.tar.gz images.jsonl sources.json candidate.json > SHA256SUMS)
          (cd artifacts/runflare && sha256sum -c SHA256SUMS)
      - name: Container diagnostics
        if: failure()
        run: |
          docker logs api || true
          docker logs web || true
      - uses: actions/upload-artifact@v4
        with:
          name: runflare-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          path: artifacts/runflare/
          retention-days: 14
