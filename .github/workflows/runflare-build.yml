name: Runflare build artifacts (no deploy)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Package committed service contexts
        run: node scripts/package-runflare.mjs HEAD
      - name: Build and smoke-test the exact upload contexts
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          for SERVICE in api web; do
            mkdir -p "/tmp/runflare-$SERVICE"
            unzip -q "artifacts/runflare/$SERVICE-$SHA.zip" -d "/tmp/runflare-$SERVICE"
            docker build --build-arg BUILD_DATE="$(git show -s --format=%cI HEAD)" \
              -t "alilab-training-$SERVICE:$SHA" "/tmp/runflare-$SERVICE"
            test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "alilab-training-$SERVICE:$SHA")" = "$SHA"
          done
          docker network create runflare-test
          docker run -d --name api --network runflare-test \
            -e PASSWORD_ONLY=1 -e COACH_DISABLED=1 -e MEDIA_UPLOADS=0 \
            -e DATA_DIR=/tmp/runflare-data -e ORIGIN=http://localhost:8080 \
            "alilab-training-api:$SHA"
          docker run -d --name web --network runflare-test -p 8080:80 "alilab-training-web:$SHA"
          curl --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ >/dev/null
          curl -fsS http://localhost:8080/corresponding-source.tar.gz -o /tmp/source.tar.gz
          tar -xOf /tmp/source.tar.gz ./deployment-source.json | grep "$SHA"
          docker image inspect "alilab-training-api:$SHA" "alilab-training-web:$SHA" \
            --format '{{json .}}' > artifacts/runflare/images.jsonl
          docker save "alilab-training-api:$SHA" "alilab-training-web:$SHA" | gzip > artifacts/runflare/images.tar.gz
          (cd artifacts/runflare && sha256sum *.zip images.tar.gz images.jsonl sources.json > SHA256SUMS)
      - name: Container diagnostics
        if: failure()
        run: |
          docker logs api || true
          docker logs web || true
      - uses: actions/upload-artifact@v4
        with:
          name: runflare-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/runflare/
          retention-days: 14
