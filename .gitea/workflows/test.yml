name: AliLab Phase 1A checks

on:
  pull_request:
  push:
    branches: [main, develop, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alilab-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          APP_BUILD: ${{ github.sha }}
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      - run: node scripts/check-alilab-boundary.mjs
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --omit=optional --ignore-scripts
        working-directory: api
      - run: npm test
        working-directory: api
      - run: node --test scripts/test/alilab-ops.test.mjs
      - run: node scripts/build-coach-assets.mjs --check
      - run: node api/scripts/check-core-loadable.mjs
      - run: npm audit --omit=dev --omit=optional --audit-level=high
        working-directory: api
